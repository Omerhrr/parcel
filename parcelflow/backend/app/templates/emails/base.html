<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset styles */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
        
        /* Template styles */
        body {
            background-color: #f4f4f5;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', sans-serif;
        }
        
        .email-wrapper {
            width: 100%;
            background-color: #f4f4f5;
            padding: 40px 20px;
        }
        
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .email-header {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            padding: 40px 40px;
            text-align: center;
        }
        
        .email-header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        
        .email-header .logo {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        
        .email-body {
            padding: 40px 40px;
            color: #374151;
        }
        
        .email-body h2 {
            color: #1f2937;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .email-body p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        
        .email-body .button {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            margin: 20px 0;
        }
        
        .email-body .button:hover {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
        }
        
        .email-body .info-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .email-body .info-box h3 {
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .email-body .info-box p {
            margin-bottom: 8px;
        }
        
        .email-body .info-box p:last-child {
            margin-bottom: 0;
        }
        
        .email-body .warning {
            background-color: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .email-body .warning p {
            margin: 0;
            color: #92400e;
        }
        
        .email-footer {
            background-color: #f9fafb;
            padding: 30px 40px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .email-footer p {
            color: #6b7280;
            font-size: 14px;
            margin: 0 0 8px 0;
        }
        
        .email-footer a {
            color: #3B82F6;
            text-decoration: none;
        }
        
        .email-footer .social-links {
            margin-top: 16px;
        }
        
        .email-footer .social-links a {
            display: inline-block;
            margin: 0 8px;
            color: #6b7280;
        }
        
        /* Responsive */
        @media screen and (max-width: 600px) {
            .email-wrapper {
                padding: 20px 10px;
            }
            
            .email-header, .email-body, .email-footer {
                padding-left: 20px;
                padding-right: 20px;
            }
            
            .email-body h2 {
                font-size: 20px;
            }
            
            .email-body p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-container">
            <!-- Header -->
            <div class="email-header">
                <div class="logo">{{ app_name }}</div>
                {% block header_subtitle %}{% endblock %}
            </div>
            
            <!-- Body -->
            <div class="email-body">
                {% block content %}{% endblock %}
            </div>
            
            <!-- Footer -->
            <div class="email-footer">
                <p>
                    <strong>{{ app_name }}</strong> - Your trusted logistics partner
                </p>
                <p>
                    &copy; {{ current_year }} {{ app_name }}. All rights reserved.
                </p>
                <p style="margin-top: 16px;">
                    <a href="{{ frontend_url }}/privacy">Privacy Policy</a>
                    &nbsp;|&nbsp;
                    <a href="{{ frontend_url }}/terms">Terms of Service</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
