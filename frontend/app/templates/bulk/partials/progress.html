<!-- Import Progress Indicator -->
<div class="bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
    <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-gray-900 dark:text-white">
            {% if status == 'completed' %}
                Import Complete
            {% elif status == 'failed' %}
                Import Failed
            {% else %}
                Processing...
            {% endif %}
        </span>
        <span class="text-sm text-gray-500 dark:text-gray-400">{{ progress }}%</span>
    </div>
    
    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
        <div class="h-2 rounded-full transition-all duration-300 
            {% if status == 'completed' %}bg-green-500
            {% elif status == 'failed' %}bg-red-500
            {% else %}bg-primary-500{% endif %}"
            style="width: {{ progress }}%"></div>
    </div>
    
    {% if status != 'completed' and status != 'failed' %}
    <p class="mt-2 text-xs text-gray-500 dark:text-gray-400">Please wait while we process your file...</p>
    {% endif %}
</div>
